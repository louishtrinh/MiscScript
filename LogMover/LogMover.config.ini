; LogMover configuration
; Edit this file with Notepad. Lines starting with ; are comments.
;
; Any folder below can be left blank. LogMover asks for it at startup and
; writes the answer back here. Folders can also be changed from the menu.

[General]
; Folder that is watched. Menu option 2 changes it and writes it back here.
WatchFolder         = \\10.100.31.50\FLYINGPROBE-IBONGMB\TAKAYA-APT1400F\TEST-LOGS\CUSTOMERS

; Which files to collect. Separate several patterns with ;
FileTypes           = *pass.atd

; How often to look for new files, in seconds.
PollSeconds         = 5

; On a brand new watch folder, how far back to reach on the first pass.
InitialLookbackDays = 1

; Record of every copy. Relative names land next to this config file.
LogFile             = LogMover.csv

[Rename]
; Extension conversions, one per line:
;
;     <extension> = <new extension>
;
; A watched type with no line here keeps its name. Not case sensitive.
.atd = .atdx

[Destination]
; Where files go when no exception below matches.
Default = \\10.100.1.21\data\PUBLIC\Auto Collection\3315 Flying Probe

[Exceptions]
; Boards that must not go to the default folder.
; One line per exception:
;
;     <string found below the watch folder> = <folder it goes to instead>
;
; Checked top to bottom, first match wins. Not case sensitive. Only the path
; BELOW the watch folder is searched, so a customer subfolder name or part of
; a filename works, and text in the watch folder path itself is ignored.
; Keep the string long enough to be unambiguous - a short one like TES will
; also hit TESLA. Example:
;
;     Crazy = \\10.100.1.21\data\PUBLIC\Auto Collection\Crazy Customer
;
; Add yours below.
