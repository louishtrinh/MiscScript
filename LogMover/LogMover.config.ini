; LogMover configuration
; Edit this file with Notepad. Lines starting with ; are comments.

[General]
; Last watch folder used. LogMover offers this at startup - press Enter to accept.
WatchFolder         = \\10.100.31.50\FLYINGPROBE-IBONGMB\TAKAYA-APT1400F\TEST-LOGS\CUSTOMERS

; Which files to collect. Separate several patterns with ;
FileTypes           = *pass.atd

; How often to look for new files, in seconds.
PollSeconds         = 5

; On a brand new watch folder, how far back to reach on the first pass.
InitialLookbackDays = 1

; Copy of every collected file is kept here. Leave blank for no backup.
BackupFolder        =

; Record of every move. Relative names land next to this config file.
LogFile             = LogMover.csv

[Rename]
; Collected files are renamed From -> To. Leave From blank to keep names as they are.
From = .atd
To   = .atdx

[Destination]
; Where files go when no exception below matches.
Default = \\10.100.1.21\data\PUBLIC\Auto Collection\3315 Flying Probe

[Exceptions]
; A string found anywhere in the file's full path  =  where that file goes instead.
; Checked top to bottom, first match wins. Not case sensitive.
; Delete these two examples and add your own.
Crazy = \\10.100.1.21\data\PUBLIC\Auto Collection\Crazy Customer
TESLA = \\10.100.1.21\data\PUBLIC\Auto Collection\3315 Flying Probe\Tesla
